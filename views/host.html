<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5faf6">
  <title>Quiz do Skee · Central de quizzes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/estilo.css">
  <style>
    .envelope { max-width: 1240px; padding-bottom: 108px; }
    .duas { display: grid; gap: 28px; grid-template-columns: 360px 1fr; align-items: start; }
    @media (max-width: 900px) { .duas { grid-template-columns: 1fr; } }

    #qr { width: 100%; border-radius: 18px; display: block; background: #fff; padding: 8px; }
    .url {
      font: 600 1rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      word-break: break-all;
      color: var(--skeelo-escuro);
    }

    .barra-controle {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; gap: 12px; align-items: center; justify-content: center;
      padding: 14px clamp(12px, 3vw, 28px);
      background: rgba(255, 255, 255, .9);
      border-top: 1px solid var(--borda);
      box-shadow: 0 -8px 24px rgba(23, 58, 41, .07);
      backdrop-filter: blur(10px);
      z-index: 40;
    }
    .barra-controle .esquerda { margin-right: auto; display: flex; gap: 10px; align-items: center; }
    .barra-controle.escondida { display: none; }

    .seletor { display: inline-flex; border: 1px solid var(--borda); border-radius: 999px; overflow: hidden; background: #fff; }
    .seletor button {
      font: 600 .9rem var(--fonte); color: var(--tinta); background: transparent;
      border: 0; padding: .5rem .9rem; cursor: pointer;
    }
    .seletor button.on { background: var(--skeelo); color: #fff; }

    /* ---------- menu de quizzes ---------- */
    .grade-quizzes {
      display: grid; gap: 18px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      margin-top: 1.6rem;
    }
    .card-quiz {
      display: flex; flex-direction: column; gap: .5rem;
      background: var(--carta); border: 1px solid var(--borda);
      border-radius: 24px; padding: 22px;
      box-shadow: 0 10px 26px rgba(23, 58, 41, .08);
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }
    .card-quiz:hover { transform: translateY(-3px); border-color: var(--skeelo-claro);
      box-shadow: 0 16px 34px rgba(23, 58, 41, .14); }
    .card-quiz .emoji { font-size: 2.2rem; line-height: 1; }
    .card-quiz .titulo { font-weight: 800; font-size: 1.15rem; }
    .card-quiz .acoes { display: flex; gap: 8px; margin-top: auto; padding-top: .8rem; }
    .card-quiz .acoes .botao { padding: .55rem 1rem; font-size: .92rem; }
    .card-novo {
      align-items: center; justify-content: center; text-align: center;
      border-style: dashed; cursor: pointer; min-height: 170px;
      color: var(--skeelo-claro); font-weight: 700;
    }
    .card-novo:hover { background: #effaf3; }
    .card-novo .mais { font-size: 2.4rem; line-height: 1; }

    /* ---------- editor ---------- */
    .ed-carta { background: #fff; border: 1px solid var(--borda); border-radius: 24px;
      margin: 18px 0; padding: 22px; box-shadow: 0 10px 26px rgba(23, 58, 41, .07); }
    .ed-carta legend {
      font-weight: 800; color: var(--skeelo-escuro);
      padding: 0 .6rem; letter-spacing: .04em;
    }
    .ed-linha { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .ed-op { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
    .ed-op input[type="radio"] { width: 20px; height: 20px; accent-color: var(--skeelo); flex: none; }
    .ed-op .forma { width: 1.6rem; text-align: center; flex: none; }
    .ed-carta textarea.campo { resize: vertical; min-height: 58px; }
    .ed-carta details { margin-top: .8rem; }
    .ed-carta summary { cursor: pointer; color: var(--skeelo-escuro); font-weight: 600; }
    .ed-rodape { display: flex; justify-content: space-between; margin-top: .8rem; }
    .ed-acoes { display: flex; gap: 12px; margin: 1.4rem 0 3rem; flex-wrap: wrap; }
    .ed-erro { color: var(--rosa); font-weight: 600; min-height: 1.4em; }
    .campo-curto { width: 110px; }

    /* ---------- jogo ---------- */
    .enunciado-grande { font-size: clamp(1.4rem, 3.4vw, 2.6rem); }
    .contagem { position: relative; }
    .contagem .n {
      position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
      font-size: 1.5rem; font-weight: 800;
    }
    .fichas { display: flex; flex-wrap: wrap; gap: 8px; }
    .ficha {
      font: 600 .95rem var(--fonte); color: var(--tinta);
      padding: .5rem .9rem; border-radius: 999px;
      background: #fff; border: 1px solid var(--borda);
      box-shadow: 0 3px 10px rgba(23, 58, 41, .07);
      cursor: pointer; transition: background .12s ease, border-color .12s ease;
    }
    .ficha:hover { background: #fff0f4; border-color: var(--rosa); color: var(--rosa); }
    .ficha.fora { opacity: .4; text-decoration: line-through; }
    .relogio {
      font-size: clamp(2.4rem, 7vw, 4.4rem); font-weight: 800;
      font-variant-numeric: tabular-nums; color: var(--skeelo-escuro); line-height: 1;
    }
    .curiosidade {
      background: #fff; border: 1px solid var(--borda);
      border-left: 5px solid var(--milho); border-radius: 0 18px 18px 0;
      padding: 1rem 1.2rem; box-shadow: 0 8px 22px rgba(23, 58, 41, .07);
      font-size: clamp(1rem, 1.8vw, 1.25rem); margin-top: 1.4rem;
    }

    /* ---------- pódio ---------- */
    #confete { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
    .podio-palco {
      display: flex; align-items: flex-end; justify-content: center;
      gap: clamp(10px, 2vw, 26px); max-width: 820px;
      margin: 1.6rem auto 0; min-height: 400px;
      background: radial-gradient(440px 210px at 50% 100%, rgba(0, 184, 113, .16), transparent 70%);
    }
    .coluna { flex: 1; max-width: 240px; opacity: 0; transform: translateY(40px); transition: opacity .5s ease, transform .5s ease; }
    .coluna.sobe { opacity: 1; transform: none; }
    .coluna .coroa {
      font-size: 2.2rem; height: 2.6rem; line-height: 2.6rem;
      opacity: 0; transform: translateY(-30px);
    }
    .c1.sobe .coroa { animation: cai .6s ease .55s forwards; }
    .coluna .avatar {
      width: clamp(56px, 7vw, 84px); height: clamp(56px, 7vw, 84px);
      margin: 0 auto .5rem; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 800; color: #14271d;
      border: 3px solid #fff; box-shadow: 0 8px 22px rgba(23, 58, 41, .22);
    }
    .c1 .avatar { background: linear-gradient(135deg, #ffd76a, #ff9f1c); }
    .c2 .avatar { background: linear-gradient(135deg, #eef2fa, #9fb0c8); }
    .c3 .avatar { background: linear-gradient(135deg, #f2b98c, #c97a3d); }
    .coluna .quem { font-weight: 800; font-size: clamp(1rem, 2.4vw, 1.4rem); word-break: break-word; }
    .coluna .qtd { font-weight: 800; color: var(--skeelo-escuro); font-variant-numeric: tabular-nums; margin-bottom: .6rem; }
    .coluna .bloco {
      position: relative; overflow: hidden;
      border-radius: 18px 18px 0 0;
      display: flex; justify-content: center; padding-top: .6rem;
      font-size: 2.4rem; font-weight: 800; color: rgba(255, 255, 255, .85);
      transform-origin: bottom; transform: scaleY(0);
      transition: transform .6s cubic-bezier(.2, .9, .3, 1.2);
    }
    .coluna .bloco::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .35) 50%, transparent 60%);
      transform: translateX(-120%);
    }
    .coluna.sobe .bloco { transform: none; }
    .coluna.sobe .bloco::after { animation: brilho 1.4s ease .7s; }
    .c1 .bloco { height: 250px; background: linear-gradient(180deg, #ffd76a, #f0a30a); }
    .c2 .bloco { height: 175px; background: linear-gradient(180deg, #e6ecf5, #a3b1c6); }
    .c3 .bloco { height: 125px; background: linear-gradient(180deg, #f0bb92, #c9803f); }
    .palco-chao {
      max-width: 860px; height: 12px; margin: 0 auto 1.6rem;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(0, 184, 113, .45), transparent);
    }
    @keyframes cai {
      from { opacity: 0; transform: translateY(-30px) rotate(-14deg); }
      60%  { opacity: 1; transform: translateY(4px) rotate(4deg); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes brilho { to { transform: translateX(120%); } }
  </style>
</head>
<body>
  <main class="envelope">

    <!-- menu / central -->
    <section id="tela-menu" class="tela">
      <p class="marca">Quiz do Skee</p>
      <h1 style="font-size:clamp(1.8rem,5vw,3rem)">Central de quizzes <span class="logo-skeelo">s<b>k</b>eelo</span></h1>
      <p class="discreto">Escolha um quiz pra apresentar, edite um existente ou crie um novo.</p>
      <div class="grade-quizzes" id="grade-quizzes"></div>
    </section>

    <!-- editor -->
    <section id="tela-editor" class="tela">
      <p class="marca">Editor</p>
      <h1 id="ed-cabecalho" style="font-size:clamp(1.6rem,4vw,2.4rem)">Novo quiz</h1>
      <div class="cartao">
        <div class="ed-linha">
          <label style="flex:1;min-width:240px">Título
            <input id="ed-titulo" class="campo" maxlength="60" placeholder="Ex.: Festas Juninas pelo mundo">
          </label>
          <label>Emoji
            <input id="ed-emoji" class="campo campo-curto centro" maxlength="4" placeholder="🎯">
          </label>
        </div>
      </div>
      <div id="ed-cartas"></div>
      <div class="ed-acoes">
        <button class="botao fantasma" id="ed-add">＋ Adicionar pergunta</button>
        <span style="flex:1"></span>
        <button class="botao fantasma" id="ed-cancelar">Cancelar</button>
        <button class="botao" id="ed-salvar">Salvar quiz</button>
      </div>
      <p class="ed-erro" id="ed-erro"></p>
    </section>

    <!-- lobby -->
    <section id="tela-lobby" class="tela">
      <p class="marca">Quiz do Skee</p>
      <h1 id="h-titulo" style="font-size:clamp(1.8rem,5vw,3.2rem)"></h1>
      <div class="duas" style="margin-top:1.4rem">
        <div class="cartao centro">
          <img id="qr" alt="QR code de entrada">
          <p class="discreto" id="h-aponte" style="margin:.9rem 0 .3rem">Aponte a câmera</p>
          <p class="url" id="url"></p>
        </div>
        <div class="cartao">
          <h2 id="h-quem">Quem já chegou <span id="n-jogadores" style="color:var(--milho)"></span></h2>
          <div class="fichas" id="fichas"></div>
          <p class="discreto" id="h-vazio" style="margin-top:1rem"></p>
        </div>
      </div>
    </section>

    <!-- pergunta / revelação -->
    <section id="tela-jogo" class="tela">
      <div style="display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap">
        <p class="marca" id="idx"></p>
        <span style="margin-left:auto" class="relogio" id="relogio"></span>
      </div>
      <h2 class="enunciado-grande" id="enunciado"></h2>
      <div class="barra-tempo"><span id="barra" style="width:100%"></span></div>
      <div class="opcoes" id="opcoes"></div>
      <p class="discreto" id="respondidos" style="margin-top:1rem"></p>
      <p class="curiosidade" id="curiosidade" hidden></p>
    </section>

    <!-- placar -->
    <section id="tela-placar" class="tela">
      <p class="marca" id="h-parcial">Placar parcial</p>
      <h2 style="font-size:clamp(1.6rem,4vw,2.6rem)" id="h-lideres">Quem está na frente</h2>
      <ol class="lista" id="placar" style="margin-top:1.2rem"></ol>
    </section>

    <!-- fim -->
    <section id="tela-fim" class="tela centro">
      <h1 id="h-fim" style="font-size:clamp(1.8rem,5vw,3rem)">Fim de festa!</h1>
      <div class="podio-palco" id="podio-palco"></div>
      <div class="palco-chao"></div>
      <ol class="lista" id="podio" style="max-width:640px;margin:0 auto;text-align:left"></ol>
    </section>
  </main>

  <div class="barra-controle" id="barra-controle">
    <div class="esquerda">
      <div class="seletor" role="group" aria-label="Idioma">
        <button id="bt-pt" class="on">PT</button>
        <button id="bt-en">EN</button>
      </div>
      <span class="discreto" id="situacao"></span>
    </div>
    <button class="botao fantasma" id="bt-menu">Menu</button>
    <button class="botao" id="bt-principal">Começar</button>
  </div>

  <canvas id="confete" aria-hidden="true"></canvas>

  <script>window.CHAVE = decodeURIComponent('__CHAVE__');</script>
  <script src="/confete.js"></script>
  <script src="/host.js"></script>
</body>
</html>
