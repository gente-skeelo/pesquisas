<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5faf6">
  <title>Quiz do Skee · Central de quizzes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/estilo.css">
  <style>
    .envelope { max-width: 1340px; padding-bottom: 104px; }
    .duas > * { height: 100%; }
    .duas { display: grid; gap: 28px; grid-template-columns: 360px 1fr; align-items: start; }
    @media (max-width: 900px) { .duas { grid-template-columns: 1fr; } }

    #qr { width: 100%; border-radius: 18px; display: block; background: #fff; padding: 8px; }
    #pin-grande {
      font-family: var(--display);
      font-size: clamp(2.6rem, 5.4vw, 3.8rem); font-weight: 600; letter-spacing: .14em;
      color: var(--tinta); margin: 0 0 .8rem; font-variant-numeric: tabular-nums;
    }
    .url {
      font: 600 1rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      word-break: break-all;
      color: var(--skeelo-escuro);
    }

    .barra-controle {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; gap: 12px; align-items: center; justify-content: center;
      padding: 14px clamp(12px, 3vw, 28px);
      background: rgba(255, 255, 255, .94);
      border-top: 1px solid var(--borda);
      box-shadow: 0 -8px 24px rgba(23, 58, 41, .07);
      backdrop-filter: blur(10px);
      z-index: 40;
    }
    .barra-controle .esquerda { margin-right: auto; display: flex; gap: 10px; align-items: center; }
    .barra-controle.escondida { display: none; }

    .seletor { display: inline-flex; border: 1px solid var(--borda); border-radius: 12px; overflow: hidden; background: #fff; }
    .seletor button {
      font: 600 .9rem var(--fonte); color: var(--tinta); background: transparent;
      border: 0; padding: .5rem .9rem; cursor: pointer;
    }
    .seletor button.on { background: var(--menta); color: var(--skeelo-escuro); }

    /* ---------- menu de quizzes ---------- */
    .grade-quizzes {
      display: grid; gap: 18px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      margin-top: 1.6rem;
    }
    .card-quiz {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; gap: .45rem;
      background: var(--carta); border: 1px solid var(--borda);
      border-radius: 16px; padding: 20px 20px 20px 24px;
      box-shadow: var(--sombra);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .card-quiz:hover { transform: translateY(-3px); box-shadow: var(--sombra2); }
    .card-quiz .emoji {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; background: var(--menta); margin-bottom: .3rem;
    }
    .card-quiz .titulo { font-weight: 800; font-size: 1.15rem; }
    .card-quiz .acoes { display: flex; gap: 8px; margin-top: auto; padding-top: .8rem; }
    .card-quiz .acoes { flex-wrap: wrap; }
    .card-quiz .acoes .botao { padding: .5rem .9rem; font-size: .9rem; }
    .card-novo {
      align-items: center; justify-content: center; text-align: center;
      border: 1.5px dashed rgba(0, 200, 83, .45); box-shadow: none;
      cursor: pointer; min-height: 176px; background: #fbfffc;
      color: var(--skeelo-escuro); font-weight: 700;
    }
    .card-novo:hover { background: #f2fdf6; box-shadow: var(--sombra); }
    .card-novo .mais { font-size: 2.4rem; line-height: 1; }

    /* ---------- editor ---------- */
    .ed-cabeca { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
    .ed-cabeca .campo { font-size: 1.05rem; }
    .ed-emoji {
      width: 74px; height: 58px; flex: none; text-align: center;
      font-size: 1.7rem; padding: 0; cursor: pointer;
    }
    .ed-rot { font-size: .82rem; font-weight: 600; color: var(--tinta2); display: block; margin-bottom: .35rem; }

    .ed-carta {
      position: relative; background: #fff; border: 1px solid var(--borda);
      border-radius: 18px; margin: 16px 0; padding: 20px; box-shadow: var(--sombra);
    }
    .ed-topo { display: flex; align-items: center; gap: .7rem; margin-bottom: .9rem; }
    .ed-num { font-family: var(--display);
      width: 30px; height: 30px; border-radius: 9px; flex: none;
      display: flex; align-items: center; justify-content: center;
      background: var(--menta); color: var(--skeelo-escuro); font-weight: 700; font-size: .9rem;
    }
    .ed-titulo-q { font-weight: 700; font-size: 1rem; }
    .ed-ferramentas { margin-left: auto; display: flex; gap: 6px; }
    .ed-ferramentas button {
      width: 32px; height: 32px; border-radius: 9px; cursor: pointer;
      border: 1px solid var(--borda); background: #fff; color: var(--tinta2);
      font-size: .95rem; line-height: 1; transition: background .12s ease, color .12s ease;
    }
    .ed-ferramentas button:hover { background: var(--menta); color: var(--skeelo-escuro); }
    .ed-ferramentas button.rem:hover { background: #fdeaef; color: #c2445f; }
    .ed-ferramentas button:disabled { opacity: .3; cursor: not-allowed; background: #fff; }

    .c-enun { font-size: 1.05rem; font-weight: 600; min-height: 62px; }

    .ed-alts { display: grid; gap: 10px; margin: 14px 0 0; }
    @media (min-width: 860px) { .ed-alts { grid-template-columns: 1fr 1fr; } }
    .ed-alt {
      display: flex; align-items: center; gap: 10px;
      background: var(--cor); border: 2px solid transparent;
      border-radius: 14px; padding: 8px 10px;
      transition: border-color .12s ease, box-shadow .12s ease;
    }
    .ed-alt[data-i="0"] { --cor: var(--op0); }
    .ed-alt[data-i="1"] { --cor: var(--op1); }
    .ed-alt[data-i="2"] { --cor: var(--op2); }
    .ed-alt[data-i="3"] { --cor: var(--op3); }
    .ed-alt .forma {
      width: 30px; text-align: center; flex: none;
      color: rgba(13, 40, 24, .5); font-size: 1rem;
    }
    .ed-alt .campo { border: 0; border-radius: 10px; padding: .6rem .75rem; }
    .ed-alt .marcar {
      flex: none; width: 30px; height: 30px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(255, 255, 255, .75);
      color: transparent; font-size: .95rem; font-weight: 800;
      border: 2px solid rgba(13, 40, 24, .18);
      transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .ed-alt .marcar:hover { border-color: var(--skeelo); color: rgba(0, 200, 83, .45); }
    .ed-alt .marcar input { position: absolute; opacity: 0; pointer-events: none; }
    .ed-alt.correta { border-color: var(--skeelo); box-shadow: 0 0 0 3px rgba(0, 200, 83, .18); }
    .ed-alt.correta .marcar { background: var(--skeelo); border-color: var(--skeelo); color: #fff; }

    .ed-linha { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; margin-top: 1rem; }
    .ed-carta textarea.campo { resize: vertical; }
    .ed-carta details { margin-top: .9rem; border-top: 1px solid var(--borda); padding-top: .8rem; }
    .ed-carta summary {
      cursor: pointer; color: var(--skeelo-escuro); font-weight: 600; font-size: .92rem;
      list-style: none; display: flex; align-items: center; gap: .4rem;
    }
    .ed-carta summary::-webkit-details-marker { display: none; }
    .ed-carta summary::before { content: '▸'; transition: transform .15s ease; }
    .ed-carta details[open] summary::before { transform: rotate(90deg); }
    .ed-carta details .ed-alt { background: #f4f8f5; }
    .ed-en-grade { display: grid; gap: 10px; margin-top: .7rem; }
    @media (min-width: 860px) { .ed-en-grade { grid-template-columns: 1fr 1fr; } }

    .ed-acoes {
      position: sticky; bottom: 0; z-index: 30;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      margin: 1.2rem 0 0; padding: 14px 0;
      background: linear-gradient(transparent, var(--fundo) 30%);
    }
    .ed-erro { color: #c2445f; font-weight: 600; min-height: 1.4em; }
    .campo-curto { width: 168px; }

    /* ---------- jogo ---------- */
    .tela.ativa.palco {
      display: flex; flex-direction: column; gap: 14px;
      min-height: calc(100vh - 208px);
    }
    .pergunta-card {
      padding: clamp(18px, 3vw, 34px) clamp(20px, 4vw, 46px);
      border-radius: 22px;
    }
    .enunciado-grande {
      font-family: var(--display); font-weight: 600;
      font-size: clamp(1.55rem, 3.7vw, 3.1rem);
      margin: 0; line-height: 1.16; text-wrap: balance;
    }
    .faixa-jogo { display: flex; align-items: center; gap: 1rem; }
    .relogio {
      width: clamp(62px, 7vw, 92px); height: clamp(62px, 7vw, 92px); flex: none;
      border-radius: 50%; background: var(--floresta); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--display); font-weight: 600;
      font-size: clamp(1.7rem, 3.6vw, 2.8rem);
      font-variant-numeric: tabular-nums;
      box-shadow: 0 8px 22px rgba(12, 50, 33, .28);
    }
    .relogio:empty { display: none; }
    .contador {
      margin: 0 0 0 auto; flex: none;
      font-weight: 700; font-size: clamp(.95rem, 1.6vw, 1.2rem); color: var(--tinta2);
      background: #fff; border: 1px solid var(--borda); border-radius: 999px;
      padding: .6rem 1.2rem; box-shadow: var(--sombra);
    }

    /* alternativas em blocos grandes, ocupando a metade de baixo */
    .opcoes.grandes { flex: 1; min-height: 0; gap: 16px; align-content: stretch; padding-bottom: 4px; }
    .opcoes.grandes .opcao {
      min-height: clamp(88px, 13.5vh, 158px);
      border-radius: 20px; border-width: 0; padding: 1.2rem 1.6rem;
      background: var(--cor);
      font-size: clamp(1.05rem, 1.9vw, 1.6rem);
      font-weight: 700; line-height: 1.25;
      box-shadow: 0 8px 22px rgba(12, 50, 33, .12);
    }
    .opcoes.grandes .opcao::before { display: none; }
    .opcoes.grandes .opcao .forma {
      width: clamp(44px, 4.4vw, 62px); height: clamp(44px, 4.4vw, 62px);
      border-radius: 16px; background: rgba(255, 255, 255, .62);
      font-size: clamp(1.2rem, 2vw, 1.7rem); color: rgba(13, 40, 24, .6);
    }
    .opcoes.grandes .opcao .n {
      position: static; transform: none; margin-left: auto;
      font-size: clamp(1.4rem, 2.6vw, 2.2rem); font-weight: 800; color: rgba(13, 40, 24, .55);
    }
    .opcoes.grandes .opcao.certa {
      box-shadow: 0 0 0 5px var(--skeelo), 0 14px 32px rgba(0, 200, 83, .3);
      transform: scale(1.015);
    }
    .opcoes.grandes .opcao.apagada { opacity: .32; }

    .curiosidade {
      flex: 1; margin: 0;
      position: relative; background: #fff; border: 1px solid var(--borda);
      border-radius: 16px; padding: .9rem 1.2rem .9rem 1.5rem;
      box-shadow: var(--sombra);
      font-size: clamp(.95rem, 1.5vw, 1.15rem);
    }
    .curiosidade::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
      background: var(--milho); border-radius: 16px 0 0 16px;
    }
    .curiosidade[hidden] { display: none; }

    .fichas { display: flex; flex-wrap: wrap; gap: 8px; }
    .ficha {
      font: 600 .95rem var(--fonte); color: var(--tinta);
      padding: .5rem .95rem; border-radius: 10px;
      background: var(--menta); border: 1px solid transparent;
      cursor: pointer; transition: background .12s ease, border-color .12s ease;
    }
    .ficha:hover { background: #fdeaef; border-color: rgba(232, 93, 126, .4); color: #c2445f; }
    .ficha.fora { opacity: .4; text-decoration: line-through; }

    /* ---------- pódio ---------- */
    #confete { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
    .podio-palco {
      display: flex; align-items: flex-end; justify-content: center;
      gap: clamp(10px, 2vw, 26px); max-width: 820px;
      margin: 1.6rem auto 0; min-height: 400px;
      background: radial-gradient(440px 210px at 50% 100%, rgba(0, 200, 83, .14), transparent 70%);
    }
    .coluna { flex: 1; max-width: 240px; opacity: 0; transform: translateY(40px); transition: opacity .5s ease, transform .5s ease; }
    .coluna.sobe { opacity: 1; transform: none; }
    .coluna .coroa {
      font-size: 2.2rem; height: 2.6rem; line-height: 2.6rem;
      opacity: 0; transform: translateY(-30px);
    }
    .c1.sobe .coroa { animation: cai .6s ease .55s forwards; }
    .coluna .avatar {
      width: clamp(56px, 7vw, 84px); height: clamp(56px, 7vw, 84px);
      margin: 0 auto .5rem; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--display); font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 600; color: #14271d;
      border: 3px solid #fff; box-shadow: 0 8px 22px rgba(23, 58, 41, .22);
    }
    .c1 .avatar { background: linear-gradient(135deg, #ffd76a, #ff9f1c); }
    .c2 .avatar { background: linear-gradient(135deg, #eef2fa, #9fb0c8); }
    .c3 .avatar { background: linear-gradient(135deg, #f2b98c, #c97a3d); }
    .coluna .quem { font-family: var(--display); font-weight: 600; font-size: clamp(1rem, 2.4vw, 1.45rem); word-break: break-word; }
    .coluna .qtd { font-family: var(--display); font-weight: 600; font-size: 1.2rem; color: var(--skeelo-escuro); font-variant-numeric: tabular-nums; margin-bottom: .6rem; }
    .coluna .bloco {
      position: relative; overflow: hidden;
      border-radius: 18px 18px 0 0;
      display: flex; justify-content: center; padding-top: .6rem;
      font-size: 2.4rem; font-weight: 800; color: rgba(255, 255, 255, .85);
      transform-origin: bottom; transform: scaleY(0);
      transition: transform .6s cubic-bezier(.2, .9, .3, 1.2);
    }
    .coluna .bloco::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .35) 50%, transparent 60%);
      transform: translateX(-120%);
    }
    .coluna.sobe .bloco { transform: none; }
    .coluna.sobe .bloco::after { animation: brilho 1.4s ease .7s; }
    .c1 .bloco { height: 250px; background: linear-gradient(180deg, #ffd76a, #f0a30a); }
    .c2 .bloco { height: 175px; background: linear-gradient(180deg, #e6ecf5, #a3b1c6); }
    .c3 .bloco { height: 125px; background: linear-gradient(180deg, #f0bb92, #c9803f); }
    .palco-chao {
      max-width: 860px; height: 12px; margin: 0 auto 1.6rem;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(0, 200, 83, .4), transparent);
    }
    @keyframes cai {
      from { opacity: 0; transform: translateY(-30px) rotate(-14deg); }
      60%  { opacity: 1; transform: translateY(4px) rotate(4deg); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes brilho { to { transform: translateX(120%); } }
  </style>
</head>
<body>
  <header class="topo">
    <div class="topo-in">
      <span class="logo-skeelo">
        <img src="/marca.svg" alt="skeelo" onerror="this.remove()"
             onload="this.nextElementSibling.hidden = true">
        <span class="palavra">skeelo</span>
      </span>
      <div class="topo-centro"><span class="pill on">◎ Quiz do Skee</span></div>
      <span class="topo-dir" id="topo-dir"></span>
    </div>
  </header>

  <main class="envelope">

    <!-- menu / central -->
    <section id="tela-menu" class="tela">
      <div class="hero">
        <p class="marca" style="color:var(--skeelo-claro)">Quiz do Skee</p>
        <h1 style="font-size:clamp(1.7rem,4.4vw,2.6rem);margin:0 0 .35rem">Central de quizzes</h1>
        <p class="discreto" style="margin:0">Escolha um quiz pra apresentar, edite um existente ou crie um novo.</p>
      </div>
      <div class="grade-quizzes" id="grade-quizzes"></div>
    </section>

    <!-- editor -->
    <section id="tela-editor" class="tela">
      <p class="marca">Editor</p>
      <h1 id="ed-cabecalho" style="font-size:clamp(1.6rem,4vw,2.4rem)">Novo quiz</h1>
      <div class="cartao faixa" style="--acento:var(--skeelo)">
        <div class="ed-cabeca">
          <div style="flex:1;min-width:240px">
            <label class="ed-rot" for="ed-titulo">Título do quiz</label>
            <input id="ed-titulo" class="campo" maxlength="60" placeholder="Ex.: Cultura pop dos anos 90">
          </div>
          <div>
            <label class="ed-rot" for="ed-emoji">Ícone</label>
            <input id="ed-emoji" class="campo ed-emoji" maxlength="4" placeholder="🎯">
          </div>
        </div>
      </div>
      <div id="ed-cartas"></div>
      <div class="ed-acoes">
        <button class="botao fantasma" id="ed-add">＋ Adicionar pergunta</button>
        <span class="discreto" id="ed-contagem"></span>
        <span style="flex:1"></span>
        <button class="botao fantasma" id="ed-cancelar">Cancelar</button>
        <button class="botao" id="ed-salvar">Salvar quiz</button>
      </div>
      <p class="ed-erro" id="ed-erro"></p>
    </section>

    <!-- lobby -->
    <section id="tela-lobby" class="tela">
      <div class="hero">
        <p class="marca" style="color:var(--skeelo-claro)">Sala aberta</p>
        <h1 id="h-titulo" style="font-size:clamp(1.6rem,4.4vw,2.8rem);margin:0"></h1>
      </div>
      <div class="duas" style="margin-top:1.4rem">
        <div class="cartao faixa centro" style="--acento:var(--op1)">
          <p class="discreto" id="h-rotpin" style="margin:0 0 .2rem">PIN da sala</p>
          <p id="pin-grande">000000</p>
          <img id="qr" alt="QR code de entrada">
          <p class="discreto" id="h-aponte" style="margin:.9rem 0 .3rem">Aponte a câmera</p>
          <p class="url" id="url"></p>
        </div>
        <div class="cartao faixa" style="--acento:var(--skeelo)">
          <h2 id="h-quem">Quem já chegou <span id="n-jogadores" style="color:var(--milho)"></span></h2>
          <div class="fichas" id="fichas"></div>
          <p class="discreto" id="h-vazio" style="margin-top:1rem"></p>
        </div>
      </div>
    </section>

    <!-- pergunta / revelação -->
    <section id="tela-jogo" class="tela palco">
      <p class="marca centro" id="idx"></p>
      <div class="cartao pergunta-card centro">
        <h2 class="enunciado-grande" id="enunciado"></h2>
      </div>
      <div class="barra-tempo"><span id="barra" style="width:100%"></span></div>
      <div class="faixa-jogo">
        <div class="relogio" id="relogio"></div>
        <p class="curiosidade" id="curiosidade" hidden></p>
        <p class="contador" id="respondidos"></p>
      </div>
      <div class="opcoes grandes" id="opcoes"></div>
    </section>

    <!-- placar -->
    <section id="tela-placar" class="tela">
      <p class="marca" id="h-parcial">Placar parcial</p>
      <h2 style="font-size:clamp(1.6rem,4vw,2.6rem)" id="h-lideres">Quem está na frente</h2>
      <ol class="lista" id="placar" style="margin-top:1.2rem"></ol>
    </section>

    <!-- fim -->
    <section id="tela-fim" class="tela centro">
      <h1 id="h-fim" style="font-size:clamp(1.8rem,5vw,3rem)">Fim de jogo!</h1>
      <div class="podio-palco" id="podio-palco"></div>
      <div class="palco-chao"></div>
      <ol class="lista" id="podio" style="max-width:640px;margin:0 auto;text-align:left"></ol>
    </section>
  </main>

  <div class="barra-controle" id="barra-controle">
    <div class="esquerda">
      <div class="seletor" role="group" aria-label="Idioma">
        <button id="bt-pt" class="on">PT</button>
        <button id="bt-en">EN</button>
      </div>
      <span class="discreto" id="situacao"></span>
    </div>
    <button class="botao fantasma" id="bt-menu">Menu</button>
    <button class="botao" id="bt-principal">Começar</button>
  </div>

  <canvas id="confete" aria-hidden="true"></canvas>

  <script>window.CHAVE = decodeURIComponent('__CHAVE__');</script>
  <script src="/confete.js"></script>
  <script src="/host.js"></script>
</body>
</html>
